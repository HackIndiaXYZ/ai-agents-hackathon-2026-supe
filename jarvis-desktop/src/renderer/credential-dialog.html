<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Google Account</title>
    <link rel="stylesheet" href="credential-dialog.css">
</head>
<body>
    <main class="dialog">
        <h1>Save Google Account</h1>
        <p class="note">Credentials are saved to Windows Credential Manager, not chat history or project files.</p>

        <label>
            Google email
            <input id="email" type="email" autocomplete="username" placeholder="you@gmail.com" spellcheck="false">
        </label>

        <label>
            Password
            <input id="password" type="password" autocomplete="current-password" placeholder="Password">
        </label>

        <div id="error" class="error" aria-live="polite"></div>

        <div class="actions">
            <button id="cancel" type="button" class="secondary">Cancel</button>
            <button id="save" type="button" class="primary">Save Securely</button>
        </div>
    </main>
    <script src="credential-dialog.js"></script>
</body>
</html>
